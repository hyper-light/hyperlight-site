<svg xmlns="http://www.w3.org/2000/svg" width="330" height="700" viewBox="0 0 330 700" role="img" aria-labelledby="title description">
  <title id="title">How Vorpal works</title>
  <desc id="description">Vorpal reads source files, parses them with Tree-sitter, links definitions and references across files, and stores a graph and search indexes. People and agents query them through the CLI or MCP server. Changed files are parsed again; cached results from other files are reused.</desc>
  <defs>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#b8c6d6" stop-opacity=".07"/><stop offset=".5" stop-color="#647688" stop-opacity=".025"/><stop offset="1" stop-color="#b6c0d5" stop-opacity=".06"/></linearGradient>
    <linearGradient id="prism" gradientUnits="userSpaceOnUse" x1="-80" y1="-60" x2="320" y2="618"><stop stop-color="#95bfb8"/><stop offset=".36" stop-color="#a5b6db"/><stop offset=".7" stop-color="#bfa7ce"/><stop offset="1" stop-color="#d5bf9e"/></linearGradient>
    <marker id="arrow" viewBox="0 0 7 8" refX="6" refY="4" markerWidth="6" markerHeight="7" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#9ca8bb"/></marker>
  </defs>
  <rect width="330" height="700" rx="9" fill="#0a0c0f"/>
  <g font-family="Arial, sans-serif"><text x="22" y="30" font-family="monospace" font-size="9" letter-spacing="1" fill="#a3aab8">VORPAL / SYSTEM MAP</text><text x="22" y="58" font-size="19" fill="#e1e5e9">How Vorpal works.</text></g>
  <g fill="none" stroke="#596373" marker-end="url(#arrow)"><path d="M174 165v24"/><path d="M174 275v24"/><path d="M174 385v24"/><path d="M174 495v24"/><path d="M63 452H36q-12 0-12-12V244q0-12 12-12h27" stroke-opacity=".7"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(174 122)"><rect x="-111" y="-43" width="222" height="86" rx="7" fill="url(#glass)" stroke="#343b46"/><path d="M-101-43h202" stroke="url(#prism)" stroke-opacity=".4"/><text x="-98" y="-23" fill="#a1aabc" font-family="monospace" font-size="10">01</text><text y="0" fill="#e1e5eb" font-size="18">Files</text><text y="23" fill="#aab2c0" font-size="13">Code + history</text></g>
    <g transform="translate(174 232)"><rect x="-111" y="-43" width="222" height="86" rx="7" fill="url(#glass)" stroke="#343b46"/><path d="M-101-43h202" stroke="url(#prism)" stroke-opacity=".4"/><text x="-98" y="-23" fill="#a1aabc" font-family="monospace" font-size="10">02</text><text y="0" fill="#e1e5eb" font-size="18">Parse</text><text y="23" fill="#aab2c0" font-size="13">Tree-sitter</text></g>
    <g transform="translate(174 342)"><rect x="-111" y="-43" width="222" height="86" rx="7" fill="url(#glass)" stroke="#343b46"/><path d="M-101-43h202" stroke="url(#prism)" stroke-opacity=".4"/><text x="-98" y="-23" fill="#a1aabc" font-family="monospace" font-size="10">03</text><text y="0" fill="#e1e5eb" font-size="18">Resolve</text><text y="23" fill="#aab2c0" font-size="13">Links across files</text></g>
    <g transform="translate(174 452)"><rect x="-111" y="-43" width="222" height="86" rx="7" fill="url(#glass)" stroke="#343b46"/><path d="M-101-43h202" stroke="url(#prism)" stroke-opacity=".4"/><text x="-98" y="-23" fill="#a1aabc" font-family="monospace" font-size="10">04</text><text y="0" fill="#e1e5eb" font-size="18">Index</text><text y="23" fill="#aab2c0" font-size="13">Graph + search indexes</text></g>
    <g transform="translate(174 562)"><rect x="-111" y="-43" width="222" height="86" rx="7" fill="url(#glass)" stroke="#343b46"/><path d="M-101-43h202" stroke="url(#prism)" stroke-opacity=".4"/><text x="-98" y="-23" fill="#a1aabc" font-family="monospace" font-size="10">05</text><text y="0" fill="#e1e5eb" font-size="18">CLI / MCP</text><text y="23" fill="#aab2c0" font-size="13">Query the code</text></g>
    <text x="174" y="638" fill="#a3adbe" font-family="monospace" font-size="11">Changed files are parsed again.</text>
    <text x="174" y="660" fill="#8997aa" font-size="11">Reuse cached results from other files.</text>
  </g>
</svg>
